name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any other organization
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ "$owner" != "deepidoo-s-new-age" ]]; then
            echo "This workflow only runs for deepidoo-s-new-age (got ${GITHUB_REPOSITORY_OWNER})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan the tree for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source "$GITHUB_WORKSPACE" --no-git --redact --exit-code 1

      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Architecture validator tests
        working-directory: tools
        run: uvx --from pytest==8.4.2 pytest -q test_validate_architecture.py
