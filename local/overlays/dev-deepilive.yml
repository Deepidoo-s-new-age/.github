# Hot-reload overlay for deepilive.
# Enabled by: make up … DEV=deepilive
# Paths are relative to local/ (project dir = first -f compose file).
#
# Base compose already builds Dockerfile.dev and mounts the source.
# This overlay keeps that explicit when DEV=deepilive is set.

services:
  deepilive-api:
    volumes:
      - ../../deepi_live/backend/app:/app/app
      - ../../deepi_live/backend/alembic:/app/alembic
      - ../../deepi_live/backend/alembic.ini:/app/alembic.ini
      - ../../contracts:/contracts
      - ../../deepilot:/deepilot

  deepilive:
    volumes:
      - ../../deepi_live/frontend-web:/app
      - na_deepilive_node_modules:/app/node_modules
      - ../../deesplay:/deesplay
      - ./docker/deesplay-consumer-tsconfig.json:/deesplay/tsconfig.json:ro
