# Hot-reload overlay for deepi-monitor (local Dockerfile.dev + bind mounts).
# Enabled by: make up … DEV=monitor
# Paths are relative to local/ (project dir = first -f compose file).
#
# Dockerfile.dev réécrit deepidoo-contracts → /contracts (editable).
# Ne pas monter pyproject.toml / uv.lock (sed build-time).

services:
  deepi-monitor:
    image: na-monitor-api:dev
    pull_policy: never
    build:
      context: ../../deepi_monitor/backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../../deepi_monitor/backend/app:/app/app
      - ../../contracts:/contracts
