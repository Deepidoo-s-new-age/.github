# Provisioned datasources — same linkage as helm-charts/charts/grafana/datasources.yaml.
apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: Request rate
            query: sum(rate(http_server_duration_milliseconds_count{$__tags}[5m]))
          - name: Error rate
            query: sum(rate(http_server_duration_milliseconds_count{$__tags,http_status_code=~"5.."}[5m]))
          - name: Latency p95
            query: histogram_quantile(0.95, sum by (le) (rate(http_server_duration_milliseconds_bucket{$__tags}[5m])))
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceid":"([0-9a-f]+)"'
          name: TraceID
          url: "$${__value.raw}"
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id
