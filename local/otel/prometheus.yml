# Local Prometheus + OTLP receiver (deepilot → /api/v1/otlp/v1/metrics).
global:
  scrape_interval: 60s
  evaluation_interval: 60s

otlp:
  promote_resource_attributes:
    - service.name
    - service.version
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
