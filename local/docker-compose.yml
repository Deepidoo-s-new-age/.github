# New Age — shared local stack (infra + optional apps).
#
#   make up PROFILES="infra"
#   make up PROFILES="infra platform" DEV=platform
#
# Hostnames (Traefik :80) — see hosts.example / make hosts-print:
#   http://pgadmin.new-age.me
#   http://auth-service.new-age.me
#   http://auth-admin.new-age.me   (ACL UI — Vite)
#   http://platform-api.new-age.me
#   http://grafana.new-age.me      (profile otel)
#   http://monitor.new-age.me
#   http://messaging.new-age.me
#   http://scheduler.new-age.me
#   http://deepipush.new-age.me
#   http://deepivoice.new-age.me
#   http://deepiads.new-age.me
#   http://deepikiosk.new-age.me
#   http://deepiflow.new-age.me
#
# Profiles: infra | otel | auth | platform | monitor | messaging | scheduler
#           | deepipush | deepivoice | deepiads | deepikiosk | deepiflow | apps | full

name: new-age

x-app-common: &app-common
  networks: [na]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  traefik:
    image: traefik:v3.6.6
    container_name: na-traefik
    profiles: ["infra", "full"]
    # Start after backends so the first Docker list already sees their labels
    # (avoids a Traefik 404 until restart when sockets miss a create event).
    depends_on:
      - postgres
      - redis
      - pgadmin
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=na-network
      - --providers.docker.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal

  postgres:
    image: postgres:18.6
    container_name: na-postgres
    profiles: ["infra", "full"]
    ports:
      - "${NEW_AGE_POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${NEW_AGE_POSTGRES_USER:-newage}
      POSTGRES_PASSWORD: ${NEW_AGE_POSTGRES_PASSWORD:-newage}
      POSTGRES_DB: ${NEW_AGE_POSTGRES_DB:-new_age}
    volumes:
      - na_pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NEW_AGE_POSTGRES_USER:-newage} -d ${NEW_AGE_POSTGRES_DB:-new_age}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - na

  redis:
    image: redis:7.4-alpine
    container_name: na-redis
    profiles: ["infra", "full"]
    ports:
      - "${NEW_AGE_REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - na

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: na-pgadmin
    profiles: ["infra", "full"]
    ports:
      - "${PGADMIN_HOST_PORT:-5051}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@new-age.me}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${NEW_AGE_POSTGRES_USER:-newage}
      POSTGRES_PASSWORD: ${NEW_AGE_POSTGRES_PASSWORD:-newage}
      POSTGRES_DB: ${NEW_AGE_POSTGRES_DB:-new_age}
    volumes:
      - na_pgadmin:/var/lib/pgadmin
      - ./pgadmin/docker-entrypoint.sh:/pgadmin-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/pgadmin-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.pgadmin.entrypoints=web
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  # --- Observability (deepilot → Tempo / Loki / Prometheus ; Grafana UI) ---
  tempo:
    image: grafana/tempo:2.7.2
    container_name: na-tempo
    profiles: ["otel", "full"]
    user: "10001:10001"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - na_tempo:/var/tempo
    ports:
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    networks:
      - na

  loki:
    image: grafana/loki:3.3.2
    container_name: na-loki
    profiles: ["otel", "full"]
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yaml", "-target=all"]
    volumes:
      - ./otel/loki.yaml:/etc/loki/config.yaml:ro
      - na_loki:/loki
    ports:
      - "${LOKI_HTTP_PORT:-3100}:3100"
    networks:
      - na

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: na-blackbox
    profiles: ["otel", "full"]
    command:
      - --config.file=/etc/blackbox/blackbox.yaml
    volumes:
      - ./otel/blackbox.yaml:/etc/blackbox/blackbox.yaml:ro
    networks:
      - na

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: na-prometheus
    profiles: ["otel", "full"]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --web.listen-address=:9090
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - na_prometheus:/prometheus
    ports:
      - "${PROMETHEUS_HTTP_PORT:-9090}:9090"
    depends_on:
      - blackbox-exporter
    networks:
      - na

  # Keeps http_server_* OTLP metrics flowing for Service/Errors dashboards (export ~60s).
  otel-synthetic-traffic:
    image: curlimages/curl:8.12.1
    container_name: na-otel-traffic
    profiles: ["apps", "full"]
    depends_on:
      - auth-service
      - platform-api
    networks:
      - na
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while true; do
          curl -sf "http://auth-service:8000/health" >/dev/null || true
          curl -sf "http://platform-api:8000/health" >/dev/null || true
          curl -sf "http://platform-api:8000/openapi.json" >/dev/null || true
          sleep 30
        done

  grafana:
    image: grafana/grafana:11.5.2
    container_name: na-grafana
    profiles: ["otel", "full"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./otel/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      # Dashboards: same JSON + provider as helm-charts/charts/grafana/dashboards/
      - ./otel/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - na_grafana:/var/lib/grafana
    ports:
      # 3001: avoid clash with legacy webapp-web on host :3000
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  auth-service:
    <<: *app-common
    profiles: ["auth", "apps", "full"]
    container_name: na-auth-api
    image: ${AUTH_IMAGE:-ghcr.io/deepidoo-s-new-age/auth-service-backend:latest}
    pull_policy: ${AUTH_PULL_POLICY:-missing}
    ports:
      - "${AUTH_HOST_PORT:-8000}:8000"
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+asyncpg://newage:newage@postgres:5432/new_age}
      WEBAPP_DATABASE_URL: ${WEBAPP_DATABASE_URL:-postgresql+asyncpg://postgres:postgres_password@host.docker.internal:5432/webapp_development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5283,http://127.0.0.1:5283,http://auth-service.new-age.me,http://auth-admin.new-age.me,http://platform-api.new-age.me,http://deepiflow.new-age.me}
      # Arbre d'organisations des routes /v1/org/* (org:admin)
      PLATFORM_API_BASE_URL: ${PLATFORM_API_BASE_URL:-http://platform-api:8000}
      # Modules M2M de dev (secret public) — local uniquement
      AUTH_SEED_LOCAL_MODULES: "true"
      DEEPILOT_SERVICE_NAME: ${DEEPILOT_AUTH_SERVICE_NAME:-auth-service}
      DEEPILOT_ENVIRONMENT: ${DEEPILOT_ENVIRONMENT:-local}
      DEEPILOT_TEMPO_ENDPOINT: ${DEEPILOT_TEMPO_ENDPOINT:-http://tempo:4318}
      DEEPILOT_LOKI_ENDPOINT: ${DEEPILOT_LOKI_ENDPOINT:-http://loki:3100/otlp}
      DEEPILOT_PROMETHEUS_ENDPOINT: ${DEEPILOT_PROMETHEUS_ENDPOINT:-http://prometheus:9090/api/v1/otlp}
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth-service.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=8000

  # Admin ACL (Vite) — toujours build local ; proxy /v1 → auth-service
  # deesplay : sans NODE_AUTH_TOKEN → file: sibling (make clone Deepidoo-s-new-age/deesplay)
  #            avec NODE_AUTH_TOKEN → GitHub Packages
  auth-admin:
    profiles: ["auth", "apps", "full"]
    container_name: na-auth-admin
    image: na-auth-admin:dev
    pull_policy: never
    build:
      context: ../../auth-service/frontend
      dockerfile: Dockerfile.dev
    working_dir: /workspace/auth-service/frontend
    environment:
      AUTH_API_PROXY: http://auth-service:8000
      NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    volumes:
      - ../../auth-service:/workspace/auth-service
      - ../../deesplay:/workspace/deesplay
      - na_auth_admin_node_modules:/workspace/auth-service/frontend/node_modules
    ports:
      - "${AUTH_ADMIN_HOST_PORT:-5174}:5174"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-service
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth-admin.rule=Host(`auth-admin.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.auth-admin.entrypoints=web
      - traefik.http.services.auth-admin.loadbalancer.server.port=5174

  platform-api:
    <<: *app-common
    profiles: ["platform", "apps", "full"]
    container_name: na-platform-api
    image: ${PLATFORM_IMAGE:-ghcr.io/deepidoo-s-new-age/platform-api-backend:latest}
    pull_policy: ${PLATFORM_PULL_POLICY:-missing}
    ports:
      - "${PLATFORM_HOST_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+asyncpg://newage:newage@postgres:5432/new_age}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      AUTH_SKIP_JTI_CHECK: ${AUTH_SKIP_JTI_CHECK:-false}
      DEEPILOT_SERVICE_NAME: ${DEEPILOT_PLATFORM_SERVICE_NAME:-platform-api}
      DEEPILOT_ENVIRONMENT: ${DEEPILOT_ENVIRONMENT:-local}
      DEEPILOT_TEMPO_ENDPOINT: ${DEEPILOT_TEMPO_ENDPOINT:-http://tempo:4318}
      DEEPILOT_LOKI_ENDPOINT: ${DEEPILOT_LOKI_ENDPOINT:-http://loki:3100/otlp}
      DEEPILOT_PROMETHEUS_ENDPOINT: ${DEEPILOT_PROMETHEUS_ENDPOINT:-http://prometheus:9090/api/v1/otlp}
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform.rule=Host(`platform-api.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.platform.entrypoints=web
      - traefik.http.services.platform.loadbalancer.server.port=8000

  # Deepi Monitor — API contrôle parc (scaffold /v1/health ; schéma monitor)
  deepi-monitor:
    <<: *app-common
    profiles: ["monitor"]
    container_name: na-monitor-api
    image: ${MONITOR_IMAGE:-ghcr.io/deepidoo-s-new-age/deepi-monitor:latest}
    pull_policy: ${MONITOR_PULL_POLICY:-missing}
    ports:
      - "${MONITOR_HOST_PORT:-8010}:8000"
    environment:
      APP_NAME: deepi-monitor
      ENVIRONMENT: ${DEEPILOT_ENVIRONMENT:-local}
      DEBUG: ${MONITOR_DEBUG:-true}
      DATABASE_URL: ${MONITOR_DATABASE_URL:-postgresql+asyncpg://newage:newage@postgres:5432/new_age}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform-api:8000}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      AUTH_SKIP_JTI_CHECK: ${AUTH_SKIP_JTI_CHECK:-false}
      MODULE_ID: ${MONITOR_MODULE_ID:-deepi_monitor}
      MODULE_CLIENT_ID: ${MONITOR_MODULE_CLIENT_ID:-deepi_monitor_client}
      MODULE_CLIENT_SECRET: ${MONITOR_MODULE_CLIENT_SECRET:-}
      CORS_ORIGINS: ${MONITOR_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://monitor.new-age.me}
    labels:
      - traefik.enable=true
      - traefik.http.routers.monitor.rule=Host(`monitor.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.monitor.entrypoints=web
      - traefik.http.services.monitor.loadbalancer.server.port=8000

  # messaging — UI Vite (proxy / vers l’API). Pas de hostname séparé pour l’API.
  messaging-api:
    profiles: ["messaging", "apps", "full"]
    container_name: na-messaging-api
    image: na-messaging-api:dev
    pull_policy: never
    build:
      context: ../../messaging/backend
      dockerfile: Dockerfile.dev
      additional_contexts:
        contracts: ../../contracts
    volumes:
      - ../../messaging/backend:/src/messaging/backend
      - ../../contracts:/src/deepidoo-contracts
      - na_messaging_venv:/src/messaging/backend/.venv
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform-api:8000}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      AUTH_SKIP_JTI_CHECK: ${MESSAGING_AUTH_SKIP_JTI_CHECK:-true}
      CORS_ORIGINS: ${MESSAGING_CORS_ORIGINS:-http://localhost:5177,http://127.0.0.1:5177,http://messaging.new-age.me}
      MESSAGING_ADMIN_ORGANISATION_IDS: ${MESSAGING_ADMIN_ORGANISATION_IDS:-1}
      MESSAGING_CATALOG_DIR: ${MESSAGING_CATALOG_DIR:-data_storage/catalog}
      MESSAGING_DUCKDB_PATH: ${MESSAGING_DUCKDB_PATH:-data_storage/messaging_history.duckdb}
      MODULE_CLIENT_SECRET: ${MESSAGING_MODULE_CLIENT_SECRET:-change-me}
      SMTP_DEV_LOCAL_MODE: ${SMTP_DEV_LOCAL_MODE:-true}
      SMTP_SERVER_ADDRESS: ${SMTP_SERVER_ADDRESS:-mailcatcher}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_EXPEDITOR_ADDRESS: ${SMTP_EXPEDITOR_ADDRESS:-devs@deepidoo.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    networks: [na]

  messaging:
    profiles: ["messaging", "apps", "full"]
    container_name: na-messaging-web
    image: na-messaging-web:dev
    pull_policy: never
    build:
      context: ../../messaging/frontend-web
      dockerfile: Dockerfile.dev
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://messaging-api:8000
      VITE_AUTH_SERVICE_URL: http://auth-service.new-age.me
    volumes:
      - ../../messaging/frontend-web:/app
      - ../../deesplay:/deesplay
      - na_messaging_node_modules:/app/node_modules
    ports:
      - "${MESSAGING_WEB_HOST_PORT:-5177}:5177"
    depends_on:
      - messaging-api
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.messaging.rule=Host(`messaging.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.messaging.entrypoints=web
      - traefik.http.services.messaging.loadbalancer.server.port=5177

  mailcatcher:
    image: schickling/mailcatcher:latest
    profiles: ["messaging", "apps", "full"]
    container_name: na-mailcatcher
    # SMTP :1025 et UI :1080 restent sur le réseau Docker (1025 est souvent déjà pris sur l’hôte).
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailcatcher.rule=Host(`mailcatcher.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.mailcatcher.entrypoints=web
      - traefik.http.services.mailcatcher.loadbalancer.server.port=1080

  # scheduler — API. / redirige vers /docs (pas de page racine).
  scheduler:
    <<: *app-common
    profiles: ["scheduler", "apps", "full"]
    container_name: na-scheduler-api
    image: na-scheduler-api:dev
    pull_policy: never
    build:
      context: ../../scheduler
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../contracts
    ports:
      - "${SCHEDULER_HOST_PORT:-8002}:8000"
    environment:
      BROKER_URL: ${SCHEDULER_BROKER_URL:-redis://redis:6379/0}
      AUTH_REDIS_URL: ${SCHEDULER_AUTH_REDIS_URL:-redis://redis:6379/1}
      BEAT_SCHEDULER_CONF_OPT: ${BEAT_SCHEDULER_CONF_OPT:-sqlalchemy_celery_beat.schedulers:DatabaseScheduler}
      PSQL_PLANNING_DB_URL: ${SCHEDULER_DATABASE_URL:-postgresql+asyncpg://newage:newage@postgres:5432/new_age}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      AUTH_SKIP_JTI_CHECK: ${AUTH_SKIP_JTI_CHECK:-false}
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.scheduler-root.redirectregex.regex=^https?://([^/]+)/?$$
      - traefik.http.middlewares.scheduler-root.redirectregex.replacement=http://$${1}/docs
      - traefik.http.routers.scheduler.rule=Host(`scheduler.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.scheduler.entrypoints=web
      - traefik.http.routers.scheduler.middlewares=scheduler-root
      - traefik.http.services.scheduler.loadbalancer.server.port=8000

  deepipush-db:
    image: postgres:16-alpine
    profiles: ["deepipush", "apps", "full"]
    container_name: na-deepipush-db
    environment:
      POSTGRES_USER: callmemaybe
      POSTGRES_PASSWORD: change-me-postgres
      POSTGRES_DB: call_me_maybe
    volumes:
      - na_deepipush_pg:/var/lib/postgresql/data
      - ../../deepipush/backend/docker/init-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callmemaybe -d call_me_maybe"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [na]

  # Dockerfile du repo copie encore call_me_maybe/ (contexte parent). Build local depuis backend/.
  deepipush:
    profiles: ["deepipush", "apps", "full"]
    container_name: na-deepipush-api
    image: na-deepipush-api:dev
    pull_policy: never
    build:
      context: ../../deepipush/backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends build-essential \
          && rm -rf /var/lib/apt/lists/*
        COPY requirements.txt /tmp/requirements.txt
        RUN grep -v '^-e ' /tmp/requirements.txt > /tmp/requirements.docker.txt \
          && pip install --no-cache-dir -r /tmp/requirements.docker.txt
        COPY . /app
        ENV PYTHONUNBUFFERED=1
        EXPOSE 8000
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://callmemaybe:change-me-postgres@deepipush-db:5432/call_me_maybe?options=-csearch_path%3Dcall_me_maybe%2Cpublic
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      AUTH_SKIP_JTI_CHECK: ${AUTH_SKIP_JTI_CHECK:-false}
      CORS_ORIGINS: ${DEEPIPUSH_CORS_ORIGINS:-http://deepipush.new-age.me}
      PLATFORM_API_BASE_URL: http://platform-api:8000
      AUTH_SERVICE_BASE_URL: http://auth-service:8000
      OSS_ACCESS_KEY_ID: ${DEEPIPUSH_OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${DEEPIPUSH_OSS_ACCESS_KEY_SECRET:-}
      PYTHONPATH: /contracts/src
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepipush-api.rule=Host(`deepipush-api.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.deepipush-api.entrypoints=web
      - traefik.http.services.deepipush-api.loadbalancer.server.port=8000
    volumes:
      - ../../deepipush/backend/app:/app/app
      - ../../deepipush/backend/migrations:/app/migrations
      - ../../contracts:/contracts
    ports:
      - "${DEEPIPUSH_HOST_PORT:-8011}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      deepipush-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [na]

  # Front Relais (Vite). deesplay = clone sibling, pas le pin GitHub privé.
  deepipush-web:
    profiles: ["deepipush", "apps", "full"]
    container_name: na-deepipush-web
    image: na-deepipush-web:dev
    pull_policy: never
    build:
      context: ../../deepipush/frontend-web
      dockerfile_inline: |
        FROM node:22-bookworm
        WORKDIR /app
        RUN corepack enable && corepack prepare yarn@4.9.2 --activate
        COPY package.json yarn.lock .yarnrc.yml ./
        RUN node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("package.json","utf8")); j.dependencies["@deepidoo/deesplay"]="portal:/deesplay/packages/deesplay"; fs.writeFileSync("package.json", JSON.stringify(j,null,2)+"\n");'
        EXPOSE 5190
        CMD ["sh","-c","yarn install && yarn dev --host 0.0.0.0 --port 5190"]
    environment:
      VITE_AUTH_SERVICE_URL: http://auth-service.${NEW_AGE_DOMAIN:-new-age.me}
      VITE_PLATFORM_API_URL: http://platform-api.${NEW_AGE_DOMAIN:-new-age.me}
      VITE_MODULE_API_URL: http://deepipush-api.${NEW_AGE_DOMAIN:-new-age.me}
      MODULE_API_PROXY: http://deepipush:8000
    volumes:
      - ../../deepipush/frontend-web/src:/app/src
      - ../../deepipush/frontend-web/public:/app/public
      - ../../deepipush/frontend-web/index.html:/app/index.html
      - ../../deepipush/frontend-web/index.relais.html:/app/index.relais.html
      - ../../deepipush/frontend-web/vite.config.ts:/app/vite.config.ts
      - ../../deepipush/frontend-web/tsconfig.json:/app/tsconfig.json
      - ../../deepipush/frontend-web/vendor:/app/vendor
      - ../../deesplay:/deesplay
      # Hide the monorepo solution tsconfig (extends @tsconfig/node22, @vue/tsconfig).
      - ./docker/deesplay-consumer-tsconfig.json:/deesplay/tsconfig.json:ro
    ports:
      - "${DEEPIPUSH_WEB_HOST_PORT:-5190}:5190"
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepipush.rule=Host(`deepipush.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.deepipush.entrypoints=web
      - traefik.http.services.deepipush.loadbalancer.server.port=5190

  deepivoice-api:
    profiles: ["deepivoice", "apps", "full"]
    container_name: na-deepivoice-api
    image: na-deepivoice-api:dev
    pull_policy: never
    build:
      context: ../../deepivoice/backend
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates curl ffmpeg libgl1 libglib2.0-0 \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY pyproject.toml ./
        COPY app ./app
        RUN pip install --no-cache-dir . && mkdir -p /app/data
        ENV HOST=0.0.0.0 PORT=8000 PYTHONUNBUFFERED=1
        EXPOSE 8000
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      CORS_ORIGINS: http://deepivoice.new-age.me,http://localhost:5180
    volumes:
      - na_deepivoice_data:/app/data
    ports:
      - "${DEEPIVOICE_API_HOST_PORT:-8003}:8000"
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepivoice-api.rule=Host(`deepivoice.${NEW_AGE_DOMAIN:-new-age.me}`) && PathPrefix(`/api`)
      - traefik.http.routers.deepivoice-api.priority=100
      - traefik.http.routers.deepivoice-api.entrypoints=web
      - traefik.http.services.deepivoice-api.loadbalancer.server.port=8000

  deepivoice:
    profiles: ["deepivoice", "apps", "full"]
    container_name: na-deepivoice-web
    image: na-deepivoice-web:dev
    pull_policy: never
    build:
      context: ../../deepivoice/frontend-web
      additional_contexts:
        deesplay: ../../deesplay/packages/deesplay
        landing: ../../deepivoice/landing-page
      args:
        VITE_AUTH_SERVICE_URL: http://auth-service.${NEW_AGE_DOMAIN:-new-age.me}
        VITE_BASE: /app/
      dockerfile_inline: |
        FROM node:22-alpine AS build
        ARG VITE_AUTH_SERVICE_URL=http://auth-service.new-age.me
        ARG VITE_BASE=/app/
        ENV VITE_AUTH_SERVICE_URL=$$VITE_AUTH_SERVICE_URL \
            VITE_BASE=$$VITE_BASE
        WORKDIR /workspace/deepivoice/frontend-web
        COPY --from=deesplay . /workspace/deesplay/packages/deesplay
        COPY package.json package-lock.json ./
        RUN npm ci \
          && mkdir -p /workspace/deesplay/packages/deesplay/node_modules \
          && ln -s /workspace/deepivoice/frontend-web/node_modules/vue \
               /workspace/deesplay/packages/deesplay/node_modules/vue \
          && ln -s /workspace/deepivoice/frontend-web/node_modules/vuetify \
               /workspace/deesplay/packages/deesplay/node_modules/vuetify
        COPY . ./
        RUN rm -f vite.config.js vite.config.d.ts && npx vite build
        FROM nginx:1.27-alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=landing . /usr/share/nginx/html/landing
        COPY --from=build /workspace/deepivoice/frontend-web/dist /usr/share/nginx/html/app
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
    ports:
      - "${DEEPIVOICE_WEB_HOST_PORT:-5180}:80"
    depends_on:
      - deepivoice-api
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepivoice.rule=Host(`deepivoice.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.deepivoice.priority=1
      - traefik.http.routers.deepivoice.entrypoints=web
      - traefik.http.services.deepivoice.loadbalancer.server.port=80

  deepiads-postgres:
    image: postgres:16-alpine
    profiles: ["deepiads", "apps", "full"]
    container_name: na-deepiads-postgres
    environment:
      POSTGRES_DB: retail_media
      POSTGRES_USER: retail_media
      POSTGRES_PASSWORD: retail_media_secret
    volumes:
      - na_deepiads_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_media"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [na]

  deepiads-redis:
    image: redis:7-alpine
    profiles: ["deepiads", "apps", "full"]
    container_name: na-deepiads-redis
    volumes:
      - na_deepiads_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [na]

  deepiads-api:
    profiles: ["deepiads", "apps", "full"]
    container_name: na-deepiads-api
    image: na-deepiads-api:dev
    pull_policy: never
    build:
      context: ../../deepiads/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://retail_media:retail_media_secret@deepiads-postgres:5432/retail_media
      DATABASE_APP_URL: postgresql://deepiads_app:retail_media_secret@deepiads-postgres:5432/retail_media
      REDIS_URL: redis://deepiads-redis:6379
      PORT: "3000"
      BASE_URL: http://deepiads.new-age.me
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: http://deepiads.new-age.me,http://localhost:3012,http://127.0.0.1:3012
      AUTH_SERVICE_URL: http://auth-service:8000
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    volumes:
      - na_deepiads_uploads:/app/uploads
    depends_on:
      deepiads-postgres:
        condition: service_healthy
      deepiads-redis:
        condition: service_healthy
    networks: [na]

  deepiads:
    profiles: ["deepiads", "apps", "full"]
    container_name: na-deepiads-web
    image: na-deepiads-web:dev
    pull_policy: never
    build:
      context: ../..
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /workspace
        COPY deesplay/packages/deesplay /workspace/deesplay/packages/deesplay
        WORKDIR /workspace/deepiads/frontend-web
        COPY deepiads/frontend-web/package.json deepiads/frontend-web/package-lock.json ./
        RUN npm ci \
            && mkdir -p /workspace/deesplay/packages/deesplay/node_modules \
            && ln -sf /workspace/deepiads/frontend-web/node_modules/vue \
                 /workspace/deesplay/packages/deesplay/node_modules/vue \
            && ln -sf /workspace/deepiads/frontend-web/node_modules/vuetify \
                 /workspace/deesplay/packages/deesplay/node_modules/vuetify \
            && ln -sf /workspace/deepiads/frontend-web/node_modules/vue-router \
                 /workspace/deesplay/packages/deesplay/node_modules/vue-router
        COPY deepiads/frontend-web ./
        RUN npx vite build
        FROM nginx:1.27-alpine AS runner
        COPY deepiads/frontend-web/nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /workspace/deepiads/frontend-web/dist /usr/share/nginx/html
        EXPOSE 8080
        CMD ["nginx", "-g", "daemon off;"]
    volumes:
      - ./docker/deepiads-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DEEPIADS_WEB_HOST_PORT:-3012}:8080"
    depends_on:
      - deepiads-api
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepiads.rule=Host(`deepiads.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.deepiads.entrypoints=web
      - traefik.http.services.deepiads.loadbalancer.server.port=8080

  deepikiosk-api:
    profiles: ["deepikiosk", "apps", "full"]
    container_name: na-deepikiosk-api
    image: na-deepikiosk-api:dev
    pull_policy: never
    build:
      context: ../../deepikiosk/backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends build-essential \
          && rm -rf /var/lib/apt/lists/*
        COPY requirements.txt /tmp/requirements.txt
        RUN pip install --no-cache-dir -r /tmp/requirements.txt
        COPY . /app
        ENV PYTHONUNBUFFERED=1 PYTHONPATH=/contracts/src
        EXPOSE 8000
        CMD ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${NEW_AGE_POSTGRES_USER:-newage}:${NEW_AGE_POSTGRES_PASSWORD:-newage}@postgres:5432/${NEW_AGE_POSTGRES_DB:-new_age}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      AUTH_SKIP_JTI_CHECK: "true"
      CORS_ORIGINS: http://deepikiosk.${NEW_AGE_DOMAIN:-new-age.me},http://localhost:3022
      MEDIA_ROOT: /data/media
      PUBLIC_APP_URL: http://deepikiosk.${NEW_AGE_DOMAIN:-new-age.me}
    volumes:
      - ../../deepikiosk/backend:/app
      - ../../contracts:/contracts:ro
      - na_deepikiosk_data:/data/media
    ports:
      - "${DEEPIKIOSK_API_HOST_PORT:-3023}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepikiosk-api.rule=Host(`deepikiosk.${NEW_AGE_DOMAIN:-new-age.me}`) && PathPrefix(`/api`)
      - traefik.http.routers.deepikiosk-api.priority=100
      - traefik.http.routers.deepikiosk-api.entrypoints=web
      - traefik.http.services.deepikiosk-api.loadbalancer.server.port=8000

  deepikiosk:
    profiles: ["deepikiosk", "apps", "full"]
    container_name: na-deepikiosk
    image: na-deepikiosk-web:dev
    pull_policy: never
    build:
      context: ../../deepikiosk/frontend-web
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        EXPOSE 5184
        CMD ["sh", "-c", "cp package-lock.json /tmp/pl.json && rm package-lock.json && npm install && mv /tmp/pl.json package-lock.json && npm run dev -- --host 0.0.0.0 --port 5184 --strictPort"]
    command: ["sh", "-c", "cp package-lock.json /tmp/pl.json && rm package-lock.json && npm install && mv /tmp/pl.json package-lock.json && npm run dev -- --host 0.0.0.0 --port 5184 --strictPort"]
    environment:
      VITE_API_PROXY_TARGET: http://deepikiosk-api:8000
      VITE_AUTH_PROXY_TARGET: http://auth-service:8000
      VITE_AUTH_SERVICE_URL: http://auth-service.${NEW_AGE_DOMAIN:-new-age.me}
    volumes:
      - ../../deepikiosk/frontend-web:/app
      - na_deepikiosk_node_modules:/app/node_modules
      - ../../deesplay:/deesplay
    ports:
      - "${DEEPIKIOSK_HOST_PORT:-3022}:5184"
    depends_on:
      - deepikiosk-api
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepikiosk.rule=Host(`deepikiosk.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.deepikiosk.priority=1
      - traefik.http.routers.deepikiosk.entrypoints=web
      - traefik.http.services.deepikiosk.loadbalancer.server.port=5184

  deepiflow-db:
    image: pgvector/pgvector:pg16
    profiles: ["deepiflow", "apps", "full"]
    container_name: na-deepiflow-db
    environment:
      POSTGRES_USER: playmusic
      POSTGRES_PASSWORD: change-me-postgres
      POSTGRES_DB: play_music_ai
    volumes:
      - play_music_ai_postgres_data:/var/lib/postgresql/data
      - ../../deepiflow/backend/docker/init-music-ai-schema.sql:/docker-entrypoint-initdb.d/01-music-ai.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmusic -d play_music_ai"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [na]

  # Dockerfile.dev attend le contexte parent (COPY deepiflow/… et COPY contracts).
  deepiflow-api:
    profiles: ["deepiflow", "apps", "full"]
    container_name: na-deepiflow-api
    image: na-deepiflow-api:dev
    pull_policy: never
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deepiflow/backend/Dockerfile.dev
    env_file:
      - ../../deepiflow/.env
    environment:
      DOCKER: "1"
      PYTHONPATH: /contracts/src
      BOOTSTRAP_SCHEMA_ON_STARTUP: "true"
      CATALOG_PREWARM_ON_STARTUP: "false"
      CATALOG_SECTIONS_PREWARM_ON_STARTUP: "false"
      PULSE_PREWARM_ON_STARTUP: "false"
      COVER_CACHE_PREWARM_ON_STARTUP: "false"
      ESSENTIA_ENABLED: "false"
      MERT_ENABLED: "0"
      YOUTUBE_POT_PROVIDER_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://playmusic:change-me-postgres@deepiflow-db:5432/play_music_ai?options=-csearch_path%3Dmusic_ai%2Cpublic
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: deepidoo-auth
      AUTH_SKIP_JTI_CHECK: "true"
      AUTH_SERVICE_URL: http://auth-service:8000
      PLATFORM_API_BASE_URL: http://platform-api:8000
      REDIS_URL: redis://redis:6379/14
      CORS_ORIGINS: http://deepiflow.${NEW_AGE_DOMAIN:-new-age.me},http://localhost:5283
    volumes:
      - ../../deepiflow/backend/app:/app/app
      - ../../deepiflow/backend/migrations:/app/migrations
      - ../../contracts:/contracts
      - na_deepiflow_data:/app/data
    ports:
      - "${DEEPIFLOW_API_HOST_PORT:-8004}:8000"
    depends_on:
      deepiflow-db:
        condition: service_healthy
    networks: [na]

  deepiflow:
    profiles: ["deepiflow", "apps", "full"]
    container_name: na-deepiflow-web
    image: na-deepiflow-web:dev
    pull_policy: never
    build:
      context: ../../deepiflow
      dockerfile: frontend-web/Dockerfile.dev
    environment:
      DOCKER: "0"
      VITE_API_PROXY_TARGET: http://deepiflow-api:8000
      VITE_AUTH_SERVICE_URL: http://auth-service.${NEW_AGE_DOMAIN:-new-age.me}
    volumes:
      - ../../deepiflow/frontend-web:/app
      - na_deepiflow_node_modules:/app/node_modules
    ports:
      - "${DEEPIFLOW_WEB_HOST_PORT:-5283}:5283"
    depends_on:
      - deepiflow-api
    networks: [na]
    labels:
      - traefik.enable=true
      - traefik.http.routers.deepiflow.rule=Host(`deepiflow.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.deepiflow.entrypoints=web
      - traefik.http.services.deepiflow.loadbalancer.server.port=5283

volumes:
  na_pgdata:
  na_pgadmin:
  na_auth_admin_node_modules:
  na_tempo:
  na_loki:
  na_prometheus:
  na_grafana:
  na_messaging_venv:
  na_messaging_node_modules:
  na_deepipush_pg:
  na_deepivoice_data:
  na_deepiads_pg:
  na_deepiads_redis:
  na_deepiads_uploads:
  na_deepikiosk_data:
  na_deepikiosk_node_modules:
  na_deepiflow_pg:
  play_music_ai_postgres_data:
    external: true
    name: play_music_ai_postgres_data
  na_deepiflow_data:
  na_deepiflow_node_modules:

networks:
  na:
    name: na-network
