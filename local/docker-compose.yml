# New Age — shared local stack (infra + optional apps).
#
#   make up PROFILES="infra"
#   make up PROFILES="infra platform" DEV=platform
#
# Hostnames (Traefik :80) — see hosts.example / make hosts-print:
#   http://pgadmin.new-age.me
#   http://auth-service.new-age.me
#   http://auth-admin.new-age.me   (ACL UI — Vite)
#   http://platform-api.new-age.me
#   http://grafana.new-age.me      (profile otel)
#   http://monitor.new-age.me
#
# Profiles: infra | otel | auth | platform | monitor | apps | full

name: new-age

x-app-common: &app-common
  networks: [na]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  traefik:
    image: traefik:v3.6.6
    container_name: na-traefik
    profiles: ["infra", "full"]
    # Start after backends so the first Docker list already sees their labels
    # (avoids a Traefik 404 until restart when sockets miss a create event).
    depends_on:
      - postgres
      - redis
      - pgadmin
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=na-network
      - --providers.docker.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal

  postgres:
    image: postgres:18.6
    container_name: na-postgres
    profiles: ["infra", "full"]
    ports:
      - "${NEW_AGE_POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${NEW_AGE_POSTGRES_USER:-newage}
      POSTGRES_PASSWORD: ${NEW_AGE_POSTGRES_PASSWORD:-newage}
      POSTGRES_DB: ${NEW_AGE_POSTGRES_DB:-new_age}
    volumes:
      - na_pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NEW_AGE_POSTGRES_USER:-newage} -d ${NEW_AGE_POSTGRES_DB:-new_age}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - na

  redis:
    image: redis:7.4-alpine
    container_name: na-redis
    profiles: ["infra", "full"]
    ports:
      - "${NEW_AGE_REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - na

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: na-pgadmin
    profiles: ["infra", "full"]
    ports:
      - "${PGADMIN_HOST_PORT:-5051}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@new-age.me}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${NEW_AGE_POSTGRES_USER:-newage}
      POSTGRES_PASSWORD: ${NEW_AGE_POSTGRES_PASSWORD:-newage}
      POSTGRES_DB: ${NEW_AGE_POSTGRES_DB:-new_age}
    volumes:
      - na_pgadmin:/var/lib/pgadmin
      - ./pgadmin/docker-entrypoint.sh:/pgadmin-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/pgadmin-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.pgadmin.entrypoints=web
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  # --- Observability (deepilot → Tempo / Loki / Prometheus ; Grafana UI) ---
  tempo:
    image: grafana/tempo:2.7.2
    container_name: na-tempo
    profiles: ["otel", "full"]
    user: "10001:10001"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - na_tempo:/var/tempo
    ports:
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    networks:
      - na

  loki:
    image: grafana/loki:3.3.2
    container_name: na-loki
    profiles: ["otel", "full"]
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yaml", "-target=all"]
    volumes:
      - ./otel/loki.yaml:/etc/loki/config.yaml:ro
      - na_loki:/loki
    ports:
      - "${LOKI_HTTP_PORT:-3100}:3100"
    networks:
      - na

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: na-blackbox
    profiles: ["otel", "full"]
    command:
      - --config.file=/etc/blackbox/blackbox.yaml
    volumes:
      - ./otel/blackbox.yaml:/etc/blackbox/blackbox.yaml:ro
    networks:
      - na

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: na-prometheus
    profiles: ["otel", "full"]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --web.listen-address=:9090
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - na_prometheus:/prometheus
    ports:
      - "${PROMETHEUS_HTTP_PORT:-9090}:9090"
    depends_on:
      - blackbox-exporter
    networks:
      - na

  # Keeps http_server_* OTLP metrics flowing for Service/Errors dashboards (export ~60s).
  otel-synthetic-traffic:
    image: curlimages/curl:8.12.1
    container_name: na-otel-traffic
    profiles: ["apps", "full"]
    depends_on:
      - auth-service
      - platform-api
    networks:
      - na
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while true; do
          curl -sf "http://auth-service:8000/health" >/dev/null || true
          curl -sf "http://platform-api:8000/health" >/dev/null || true
          curl -sf "http://platform-api:8000/openapi.json" >/dev/null || true
          sleep 30
        done

  grafana:
    image: grafana/grafana:11.5.2
    container_name: na-grafana
    profiles: ["otel", "full"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./otel/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      # Dashboards: same JSON + provider as helm-charts/charts/grafana/dashboards/
      - ./otel/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - na_grafana:/var/lib/grafana
    ports:
      # 3001: avoid clash with legacy webapp-web on host :3000
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  auth-service:
    <<: *app-common
    profiles: ["auth", "apps", "full"]
    container_name: na-auth-api
    image: ${AUTH_IMAGE:-ghcr.io/deepidoo-s-new-age/auth-service:latest}
    pull_policy: ${AUTH_PULL_POLICY:-missing}
    ports:
      - "${AUTH_HOST_PORT:-8000}:8000"
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+asyncpg://newage:newage@postgres:5432/new_age}
      WEBAPP_DATABASE_URL: ${WEBAPP_DATABASE_URL:-postgresql+asyncpg://postgres:postgres_password@host.docker.internal:5432/webapp_development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://auth-service.new-age.me,http://auth-admin.new-age.me,http://platform-api.new-age.me}
      DEEPILOT_SERVICE_NAME: ${DEEPILOT_AUTH_SERVICE_NAME:-auth-service}
      DEEPILOT_ENVIRONMENT: ${DEEPILOT_ENVIRONMENT:-local}
      DEEPILOT_TEMPO_ENDPOINT: ${DEEPILOT_TEMPO_ENDPOINT:-http://tempo:4318}
      DEEPILOT_LOKI_ENDPOINT: ${DEEPILOT_LOKI_ENDPOINT:-http://loki:3100/otlp}
      DEEPILOT_PROMETHEUS_ENDPOINT: ${DEEPILOT_PROMETHEUS_ENDPOINT:-http://prometheus:9090/api/v1/otlp}
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth-service.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=8000

  # Admin ACL (Vite) — toujours build local ; proxy /v1 → auth-service
  # deesplay : sans NODE_AUTH_TOKEN → file: sibling (make clone Deepidoo-s-new-age/deesplay)
  #            avec NODE_AUTH_TOKEN → GitHub Packages
  auth-admin:
    profiles: ["auth", "apps", "full"]
    container_name: na-auth-admin
    image: na-auth-admin:dev
    pull_policy: never
    build:
      context: ../../auth-service/frontend
      dockerfile: Dockerfile.dev
    working_dir: /workspace/auth-service/frontend
    environment:
      AUTH_API_PROXY: http://auth-service:8000
      NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    volumes:
      - ../../auth-service:/workspace/auth-service
      - ../../deesplay:/workspace/deesplay
      - na_auth_admin_node_modules:/workspace/auth-service/frontend/node_modules
    ports:
      - "${AUTH_ADMIN_HOST_PORT:-5174}:5174"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-service
    networks:
      - na
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth-admin.rule=Host(`auth-admin.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.auth-admin.entrypoints=web
      - traefik.http.services.auth-admin.loadbalancer.server.port=5174

  platform-api:
    <<: *app-common
    profiles: ["platform", "apps", "full"]
    container_name: na-platform-api
    image: ${PLATFORM_IMAGE:-ghcr.io/deepidoo-s-new-age/platform-api:latest}
    pull_policy: ${PLATFORM_PULL_POLICY:-missing}
    ports:
      - "${PLATFORM_HOST_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+asyncpg://newage:newage@postgres:5432/new_age}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      AUTH_SKIP_JTI_CHECK: ${AUTH_SKIP_JTI_CHECK:-false}
      DEEPILOT_SERVICE_NAME: ${DEEPILOT_PLATFORM_SERVICE_NAME:-platform-api}
      DEEPILOT_ENVIRONMENT: ${DEEPILOT_ENVIRONMENT:-local}
      DEEPILOT_TEMPO_ENDPOINT: ${DEEPILOT_TEMPO_ENDPOINT:-http://tempo:4318}
      DEEPILOT_LOKI_ENDPOINT: ${DEEPILOT_LOKI_ENDPOINT:-http://loki:3100/otlp}
      DEEPILOT_PROMETHEUS_ENDPOINT: ${DEEPILOT_PROMETHEUS_ENDPOINT:-http://prometheus:9090/api/v1/otlp}
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform.rule=Host(`platform-api.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.platform.entrypoints=web
      - traefik.http.services.platform.loadbalancer.server.port=8000

  # Deepi Monitor — API contrôle parc (scaffold /v1/health ; schéma monitor)
  deepi-monitor:
    <<: *app-common
    profiles: ["monitor", "apps", "full"]
    container_name: na-monitor-api
    image: ${MONITOR_IMAGE:-ghcr.io/deepidoo-s-new-age/deepi-monitor:latest}
    pull_policy: ${MONITOR_PULL_POLICY:-missing}
    ports:
      - "${MONITOR_HOST_PORT:-8010}:8000"
    environment:
      APP_NAME: deepi-monitor
      ENVIRONMENT: ${DEEPILOT_ENVIRONMENT:-local}
      DEBUG: ${MONITOR_DEBUG:-true}
      DATABASE_URL: ${MONITOR_DATABASE_URL:-postgresql+asyncpg://newage:newage@postgres:5432/new_age}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/14}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform-api:8000}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-deepidoo-auth}
      AUTH_SKIP_JTI_CHECK: ${AUTH_SKIP_JTI_CHECK:-false}
      MODULE_ID: ${MONITOR_MODULE_ID:-deepi_monitor}
      MODULE_CLIENT_ID: ${MONITOR_MODULE_CLIENT_ID:-deepi_monitor_client}
      MODULE_CLIENT_SECRET: ${MONITOR_MODULE_CLIENT_SECRET:-}
      CORS_ORIGINS: ${MONITOR_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://monitor.new-age.me}
    labels:
      - traefik.enable=true
      - traefik.http.routers.monitor.rule=Host(`monitor.${NEW_AGE_DOMAIN:-new-age.me}`)
      - traefik.http.routers.monitor.entrypoints=web
      - traefik.http.services.monitor.loadbalancer.server.port=8000

volumes:
  na_pgdata:
  na_pgadmin:
  na_auth_admin_node_modules:
  na_tempo:
  na_loki:
  na_prometheus:
  na_grafana:

networks:
  na:
    name: na-network
